name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/capture-linux-baselines

# 默认最小权限；各 job 仅读取仓库内容。
permissions:
  contents: read

# 同一分支的新提交取消尚未完成的旧运行，减少排队浪费。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate versions
        run: pnpm validate:versions

      - name: Validate text policy
        run: pnpm validate:text

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and repository tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify app build content gate
        run: pnpm test:content-boundary:build

      - name: Verify production content boundary
        run: pnpm test:content-boundary:server

  e2e:
    name: E2E and accessibility
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Record hosted capture provenance
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/capture-linux-baselines' }}
        run: |
          echo "git revision:"
          git rev-parse HEAD
          echo "kernel:"
          uname -a
          echo "OS:"
          cat /etc/os-release
          echo "node:"
          node --version
          echo "pnpm:"
          pnpm --version
          echo "playwright:"
          pnpm exec playwright --version
          echo "playwright installations:"
          pnpm exec playwright install --list

      - name: Capture hosted Linux visual baselines
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/capture-linux-baselines' }}
        env:
          E2E_PORT: "43118"
        run: pnpm exec playwright test tests/e2e/visual.spec.ts --project=desktop --update-snapshots

      - name: Verify hosted Linux baseline set
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/capture-linux-baselines' }}
        run: |
          set -euo pipefail
          snapshot_dir="tests/e2e/__screenshots__/visual.spec.ts-snapshots"
          expected=(
            "$snapshot_dir/article-detail-desktop-linux.png"
            "$snapshot_dir/home-desktop-linux.png"
            "$snapshot_dir/jd-radar-idle-desktop-linux.png"
            "$snapshot_dir/jd-radar-ready-desktop-linux.png"
            "$snapshot_dir/jd-radar-stale-desktop-linux.png"
            "$snapshot_dir/tools-index-desktop-linux.png"
          )
          mapfile -t actual < <(find "$snapshot_dir" -maxdepth 1 -type f -name '*-linux.png' -print | sort)
          if (( ${#actual[@]} != 6 )); then
            echo "Expected exactly 6 Linux visual baselines, found ${#actual[@]}."
            printf '%s\n' "${actual[@]}"
            exit 1
          fi
          expected_sorted=$(printf '%s\n' "${expected[@]}" | sort)
          actual_sorted=$(printf '%s\n' "${actual[@]}")
          if [[ "$actual_sorted" != "$expected_sorted" ]]; then
            echo "Linux visual baseline set does not match expected files."
            echo "Expected:"
            printf '%s\n' "$expected_sorted"
            echo "Actual:"
            printf '%s\n' "$actual_sorted"
            exit 1
          fi

      - name: Run Playwright suite
        env:
          E2E_PORT: "43117"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload hosted Linux visual baselines
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/capture-linux-baselines' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines-${{ github.run_id }}
          path: tests/e2e/__screenshots__/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Docker compose smoke test
        run: pnpm test:docker
